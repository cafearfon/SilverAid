# SilverAid en el NAS (Synology + Portainer), con MongoDB.
# A diferencia de docker-compose.mongo.yml no construye ninguna imagen: usa python:3.12-slim y monta la carpeta del
# código, así que para actualizar basta con copiar los archivos nuevos (o «git pull») y reiniciar silveraid_app.
#
# Las contraseñas no van aquí. En Portainer: Stacks → la pila → «Environment variables», defina:
#   MONGO_ROOT_PASSWORD   contraseña de MongoDB (obligatoria)
#   MONGO_ROOT_USER       usuario de MongoDB (por defecto silveraid)
#   MONGO_DATABASE        base de datos (por defecto silveraid)
#   APP_DIR               carpeta del código en el NAS (por defecto /volume1/docker/silveraid/SilverAid)
#   MONGO_DATA_DIR        carpeta de los datos de MongoDB (por defecto /volume1/docker/silveraid/datas)
#   APP_PORT              puerto publicado de la aplicación (por defecto 58000; el proxy inverso apunta aquí)
# Fuera de Portainer, ponga esas variables en un archivo .env junto a este y ejecute:
#   docker compose -f docker-compose.nas.yml up -d
# El registro de silveraid_app debe terminar con «datos en MongoDB mongodb://db:27017/silveraid».
services:
  # Contenedor de Linux con Python: instala las dependencias y arranca SilverAid con MongoDB
  app:
    image: python:3.12-slim
    container_name: silveraid_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ${APP_DIR:-/volume1/docker/silveraid/SilverAid}:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python server.py 8000"
    environment:
      STORAGE: mongo
      MONGO_HOST: db
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_ROOT_USER:-silveraid}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD}
      MONGO_AUTH_SOURCE: admin
      MONGO_DATABASE: ${MONGO_DATABASE:-silveraid}
      TZ: America/Bogota
      PYTHONUNBUFFERED: "1"
    ports:
      - "${APP_PORT:-58000}:8000"
    depends_on:
      - db

  # Contenedor de MongoDB
  db:
    image: mongo:8.0
    container_name: silveraid_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-silveraid}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-silveraid}
    ports:
      - "27017:27017"   # para administrarlo desde la red local; quítelo si solo lo usa la aplicación
    volumes:
      - ${MONGO_DATA_DIR:-/volume1/docker/silveraid/datas}:/data/db
